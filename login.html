<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <span class="login-brand__mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </span>
                <h1>Salon Admin</h1>
                <p>Sign in to manage your salon</p>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="login-email">Email</label>
                    <input type="email" id="login-email" class="form-control" placeholder="admin@gmail.com" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <p class="login-error" id="login-error" hidden></p>
                <button type="submit" class="btn btn-primary login-submit" id="login-submit">Sign In</button>
            </form>

            <p class="login-back"><a href="index.html">Back to website</a></p>
        </div>
    </main>

    <script src="js/data/default-data.js"></script>
    <script src="js/data/storage.js"></script>
    <script src="js/admin/auth.js"></script>
</body>
</html>
